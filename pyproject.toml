[project]
name = "rlt"
version = "0.1.0"
description = "RL Token: Bootstrapping Online RL with Vision-Language-Action Models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jax[cuda12]==0.5.3",
    "flax==0.10.2",
    "optax>=0.2.4",
    "orbax-checkpoint==0.11.13",
    "numpy>=1.22.4,<2.0.0",
    "einops>=0.8.0",
    "wandb>=0.19.1",
    "tqdm-loggable>=0.2",
    "tyro>=0.9.5",
    "sentencepiece>=0.2.0",
    "pillow>=11.0.0",
    "opencv-python>=4.10.0.84",
    "pyyaml>=6.0",
    "beartype==0.19.0",
    "jaxtyping==0.2.36",
    "typing-extensions>=4.12.2",
    "dm-tree>=0.1.8",
    "fsspec[gcs]>=2024.6.0",
    "filelock>=3.16.1",
    "transformers==4.53.2",
    "torch==2.7.1",
    "lerobot",
    "gym-aloha>=0.1.1",
    "openpi",
    "chex>=0.1.90",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "ruff>=0.8.6",
]

[tool.uv]
override-dependencies = ["ml-dtypes==0.4.1", "tensorstore==0.1.74"]

[tool.uv.sources]
openpi = { git = "https://github.com/Physical-Intelligence/openpi" }
lerobot = { git = "https://github.com/huggingface/lerobot", rev = "0cf864870cf29f4738d3ade893e6fd13fbd7cdb5" }

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E4", "E7", "E9",
    "F",
    "I",
    "UP",
    "W",
]

[tool.ruff.lint.isort]
force-single-line = true
force-sort-within-sections = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rlt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
