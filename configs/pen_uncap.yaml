# RLT Configuration for ALOHA Pen Uncap Task
# Dataset: physical-intelligence/aloha_pen_uncap_diverse
# Robot: ALOHA (Trossen ViperX bimanual)

task_name: "aloha_pen_uncap"
vla_checkpoint: "gs://openpi-assets/checkpoints/pi05_base/params"

# ALOHA action space: 14-dim (6 joints + 1 gripper) × 2 arms
action_dim: 14
action_chunk_length: 10
proprio_dim: 14

# Dataset config
dataset:
  repo_id: "physical-intelligence/aloha_pen_uncap_diverse"
  prompt: "uncap the pen"
  adapt_to_pi: true

# RL Token (Section IV-A)
rl_token:
  token_dim: 2048
  encoder_num_layers: 2
  encoder_num_heads: 8
  encoder_mlp_dim: 2048
  decoder_num_layers: 4
  decoder_num_heads: 8
  decoder_mlp_dim: 2048
  vla_embed_dim: 2048
  learning_rate: 1.0e-4
  vla_sft_alpha: 0.0
  num_train_steps: 5000
  batch_size: 32

# Actor (Appendix B: 2-layer 256-dim MLP for pen_uncap)
actor:
  hidden_dims: [256, 256]
  learning_rate: 3.0e-4
  init_std: 0.1

# Critic (Appendix B: 2-layer 256-dim)
critic:
  hidden_dims: [256, 256]
  learning_rate: 3.0e-4
  discount: 0.99
  tau: 0.005
  critic_updates_per_actor: 2

# Training (Algorithm 1)
training:
  replay_buffer_size: 100000
  num_warmup_episodes: 50
  batch_size: 256
  beta: 1.0
  reference_action_dropout: 0.5
  action_chunk_stride: 2
  control_frequency_hz: 50
  utd_ratio: 5
  max_env_steps: 50000
  log_interval: 100
  checkpoint_interval: 5000
  wandb_project: "rlt-pen-uncap"
  seed: 42
