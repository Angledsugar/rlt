# RLT Default Configuration
# Based on paper defaults (Section V, Appendix B)

task_name: "default"
vla_checkpoint: "gs://openpi-assets/checkpoints/pi05_base/params"

# Action space
action_dim: 14
action_chunk_length: 10
proprio_dim: 14

# RL Token (Section IV-A, Figure 2)
rl_token:
  token_dim: 2048
  encoder_num_layers: 2
  encoder_num_heads: 8
  encoder_mlp_dim: 2048
  decoder_num_layers: 4
  decoder_num_heads: 8
  decoder_mlp_dim: 2048
  vla_embed_dim: 2048
  learning_rate: 1.0e-4
  vla_sft_alpha: 0.0
  num_train_steps: 10000
  batch_size: 32

# Actor (Section IV-B, Appendix B)
actor:
  hidden_dims: [256, 256]
  learning_rate: 3.0e-4
  init_std: 0.1

# Critic (Section IV-B)
critic:
  hidden_dims: [256, 256]
  learning_rate: 3.0e-4
  discount: 0.99
  tau: 0.005
  critic_updates_per_actor: 2

# Training (Algorithm 1, Section V)
training:
  replay_buffer_size: 100000
  num_warmup_episodes: 50
  batch_size: 256
  beta: 1.0
  reference_action_dropout: 0.5
  action_chunk_stride: 2
  control_frequency_hz: 50
  utd_ratio: 5
  max_env_steps: 100000
  log_interval: 100
  checkpoint_interval: 5000
  wandb_project: "rlt"
  seed: 42
