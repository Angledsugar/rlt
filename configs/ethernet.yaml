# RLT Configuration for Ethernet Insertion Task
# Paper Section VI-A: "insert Ethernet cable into a recessed port"

task_name: "ethernet_insertion"
vla_checkpoint: "gs://openpi-assets/checkpoints/pi05_base/params"

action_dim: 14
action_chunk_length: 10
proprio_dim: 14

rl_token:
  token_dim: 2048
  encoder_num_layers: 2
  encoder_num_heads: 8
  encoder_mlp_dim: 2048
  decoder_num_layers: 4
  decoder_num_heads: 8
  decoder_mlp_dim: 2048
  vla_embed_dim: 2048
  learning_rate: 1.0e-4
  num_train_steps: 10000
  batch_size: 32

# Ethernet uses 2-layer 256-dim MLP (easier task, Appendix B)
actor:
  hidden_dims: [256, 256]
  learning_rate: 3.0e-4
  init_std: 0.1

critic:
  hidden_dims: [256, 256]
  learning_rate: 3.0e-4
  discount: 0.99
  tau: 0.005
  critic_updates_per_actor: 2

training:
  replay_buffer_size: 100000
  num_warmup_episodes: 50
  batch_size: 256
  beta: 1.0
  reference_action_dropout: 0.5
  action_chunk_stride: 2
  control_frequency_hz: 50
  utd_ratio: 5
  max_env_steps: 50000
  log_interval: 100
  checkpoint_interval: 5000
  wandb_project: "rlt-ethernet"
  seed: 42
